name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Core tests
        run: pnpm test:core
      - name: Benchmark utility tests
        run: pnpm test:benchmark
      - name: Website type check
        run: pnpm test:website
      - name: Build publishable core
        run: pnpm build:core
      - name: Inspect npm package contents
        run: pnpm check:package
      # The 30,000-byte Brotli budget is a known-unmet release gate. Surfaced
      # here rather than blocking CI; see MODEL_CARD.md.
      - name: Release size gate
        run: pnpm size:gate
        continue-on-error: true
