<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>gpu-time Open Graph Image</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        padding: 64px 72px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: #fff;
        color: #171717;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.8px;
      }
      .brand svg {
        width: 38px;
        height: 38px;
      }
      h1 {
        margin: 40px 0 0;
        font-size: 68px;
        line-height: 1.08;
        font-weight: 560;
        letter-spacing: -3px;
      }
      .description {
        margin: 18px 0 0;
        color: #727272;
        font-size: 26px;
        letter-spacing: -0.5px;
      }
      .phrase {
        margin-top: 52px;
        font-size: 30px;
        letter-spacing: -0.5px;
        white-space: nowrap;
      }
      .hl {
        display: inline-block;
        margin: 0 0.06em;
        padding: 0.16em 0.36em;
        border-radius: 6px;
        background: var(--c);
      }
    </style>
  </head>
  <body>
    <div class="brand"><!-- LOGO -->gpu-time</div>
    <h1>Plain English to Real Dates</h1>
    <p class="description">
      A small neural model, running locally in your browser
    </p>
    <div class="phrase">
      <span class="hl" style="--c: #e2dcfd">every</span>
      <span class="hl" style="--c: #cfe3fd">Monday</span>
      <span class="hl" style="--c: #fde8b4">from 8pm to 10pm</span>
    </div>
  </body>
</html>
