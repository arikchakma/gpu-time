<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>gpu-time Video Thumbnail</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #fff;
        color: #171717;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .brand {
        position: absolute;
        left: 96px;
        top: 76px;
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -1px;
      }
      .brand svg {
        width: 50px;
        height: 50px;
      }
      h1 {
        position: absolute;
        left: 96px;
        top: 310px;
        width: 840px;
        text-align: left;
        margin: 0;
        font-size: 100px;
        line-height: 1.07;
        font-weight: 560;
        letter-spacing: -5px;
      }
      h1 span {
        display: block;
      }
      .description {
        position: absolute;
        left: 96px;
        top: 568px;
        width: 840px;
        text-align: left;
        margin: 0;
        color: #727272;
        font-size: 32px;
        line-height: 1.45;
        letter-spacing: -0.7px;
      }
      .network {
        position: absolute;
        top: 180px;
        right: 75px;
        width: 810px;
        height: 610px;
      }
      .network-label {
        position: absolute;
        top: 796px;
        right: 128px;
        width: 700px;
        text-align: center;
        font-size: 25px;
        color: #81858d;
        letter-spacing: -0.3px;
      }
      footer {
        position: absolute;
        left: 96px;
        right: 96px;
        bottom: 73px;
        border-top: 2px solid #ededed;
        padding-top: 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 26px;
        letter-spacing: -0.5px;
        color: #777;
      }
      .duration {
        font-variant-numeric: tabular-nums;
        color: #171717;
      }
    </style>
  </head>
  <body>
    <div class="brand"><!-- LOGO -->gpu-time</div>
    <h1><span>How a Tiny Model</span><span>Understands Time</span></h1>
    <p class="description">
      From English to dates.<br />A neural network, running right on your
      device.
    </p>
    <svg
      class="network"
      viewBox="0 0 810 610"
      fill="none"
      aria-label="Simplified neural network"
    ></svg>
    <div class="network-label">Small model. Real language.</div>
    <footer>
      <span>Inside the Neural Model</span
      ><span><span id="model-size">24,761 parameters</span> · Runs locally</span
      ><span class="duration">1:31</span>
    </footer>
    <script>
      // A schematic of the output head; no invented weights or activation values.
      const svg = document.querySelector(".network");
      const layers = [
        { x: 55, n: 8 },
        { x: 280, n: 6 },
        { x: 505, n: 10 },
        { x: 740, n: 8 },
      ];
      const points = layers.map(({ x, n }) =>
        Array.from({ length: n }, (_, i) => ({
          x,
          y: 100 + (i * 410) / (n - 1),
        })),
      );
      const node = (tag, attributes) => {
        const element = document.createElementNS(
          "http://www.w3.org/2000/svg",
          tag,
        );
        Object.entries(attributes).forEach(([key, value]) =>
          element.setAttribute(key, String(value)),
        );
        svg.append(element);
      };
      for (const [from, to] of [
        [0, 1],
        [0, 2],
        [1, 2],
        [2, 3],
      ]) {
        points[from].forEach((a, i) =>
          points[to].forEach((b, j) => {
            if ((i + j) % 3 === 0)
              node("path", {
                d: `M${a.x} ${a.y} L${b.x} ${b.y}`,
                stroke: "#dce4ef",
                "stroke-width": 1.6,
              });
          }),
        );
      }
      const route = [points[0][4], points[1][2], points[2][5], points[3][3]];
      route.slice(1).forEach((point, i) =>
        node("path", {
          d: `M${route[i].x} ${route[i].y} L${point.x} ${point.y}`,
          stroke: "#2563eb",
          "stroke-width": 3,
        }),
      );
      points.flat().forEach((point) =>
        node("circle", {
          cx: point.x,
          cy: point.y,
          r: 8,
          fill: "#fff",
          stroke: "#b4c8e7",
          "stroke-width": 2.5,
        }),
      );
      route.forEach((point) =>
        node("circle", {
          cx: point.x,
          cy: point.y,
          r: 10,
          fill: "#2563eb",
          stroke: "#fff",
          "stroke-width": 3,
        }),
      );
    </script>
  </body>
</html>
